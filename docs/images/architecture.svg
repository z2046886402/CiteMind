<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CiteMind 系统架构</title>
  <desc id="desc">React 前端通过 HTTP 与 SSE 访问 FastAPI。后端组织导入、检索和问答，使用 PostgreSQL、Elasticsearch、本机原文件与远程模型服务。浏览器提供语音识别入口。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#7f9d94"/></marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;fill:#304d48}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#728b83}
      .heading{font-size:18px;font-weight:700}.body{font-size:14px;fill:#607a71}
      .caption{font-size:11px;fill:#899f96;letter-spacing:1px}.small{font-size:12px;fill:#7a9389}
      .box{fill:#fff;stroke:#dbe8e1;stroke-width:1.5}.line{fill:none;stroke:#7f9d94;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="22" fill="#f5f9f6"/>
  <text x="42" y="49" class="title">CiteMind</text>
  <text x="187" y="48" class="sub">从文献导入，到有来源可查的回答</text>
  <text x="42" y="103" class="caption">交互入口</text>
  <text x="426" y="103" class="caption">应用服务</text>
  <text x="846" y="43" class="caption">持久化与原文</text>
  <rect class="box" x="42" y="128" width="276" height="300" rx="17"/>
  <rect x="42" y="128" width="276" height="66" rx="17" fill="#245d56"/>
  <path d="M42 177H318V194H42Z" fill="#245d56"/>
  <text x="65" y="167" class="heading" style="fill:white">React · TypeScript</text>
  <text x="65" y="228" class="body">批量上传与处理结果</text>
  <text x="65" y="265" class="body">文献检索与多轮会话</text>
  <text x="65" y="302" class="body">Markdown 回答与引用预览</text>
  <text x="65" y="339" class="body">语音草稿与问答导出</text>
  <path d="M65 366H294" stroke="#e9efeb"/>
  <text x="65" y="397" class="small">浏览器语音识别 · 手动确认发送</text>
  <path class="line" d="M326 267H414"/>
  <path class="line" d="M414 302H326"/>
  <text x="344" y="248" class="small">HTTP</text>
  <text x="344" y="326" class="small">SSE</text>
  <rect class="box" x="426" y="128" width="310" height="300" rx="17"/>
  <text x="451" y="167" class="heading">FastAPI · Python</text>
  <path d="M451 188H711" stroke="#e4ece7"/>
  <text x="451" y="222" class="body">鉴权与文献归属检查</text>
  <text x="451" y="260" class="body">解析 → 分块 → 向量 → 索引</text>
  <text x="451" y="298" class="body">混合召回 → 规则 / 模型重排</text>
  <text x="451" y="336" class="body">流式回答、推荐追问与标题</text>
  <text x="451" y="387" class="small">保存消息与引用快照后确认完成</text>
  <path class="line" d="M745 222H794V120H834"/>
  <path class="line" d="M745 278H834"/>
  <path class="line" d="M745 336H794V379H834"/>
  <rect class="box" x="846" y="65" width="310" height="110" rx="15"/>
  <text x="869" y="103" class="heading">PostgreSQL</text>
  <text x="869" y="133" class="body">用户、文献元数据、会话与消息</text>
  <text x="869" y="154" class="small">持久化索引状态与引用快照</text>
  <rect class="box" x="846" y="223" width="310" height="110" rx="15"/>
  <text x="869" y="261" class="heading">Elasticsearch</text>
  <text x="869" y="291" class="body">关键词检索与 1024 维向量检索</text>
  <text x="869" y="312" class="small">分块正文、向量与来源信息</text>
  <rect class="box" x="846" y="354" width="310" height="74" rx="15"/>
  <text x="869" y="386" class="heading">本机原始文献</text>
  <text x="869" y="409" class="small">PDF / DOCX / TXT · 受登录保护读取</text>
  <path class="line" d="M581 439V480"/>
  <rect x="426" y="492" width="310" height="89" rx="15" fill="#e7f1eb" stroke="#ccded3"/>
  <text x="451" y="528" class="heading">远程模型服务</text>
  <text x="451" y="555" class="body">Embedding · Chat · 可选 Rerank</text>
  <text x="42" y="555" class="small">本机开发架构 · 前后端分离</text>
  <text x="846" y="554" class="small">图示为当前代码的模块关系</text>
</svg>
